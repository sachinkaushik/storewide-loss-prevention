#
# Behavioral Analysis Pattern Configuration
#
# This file defines the activity patterns to detect.
# Each pattern has:
#   - Pose-based rules (keypoint matching)
#   - VLM prompt for visual confirmation
#   - Response schema the VLM must follow
#
# The service is generic -- add new patterns here without code changes.

patterns:
  shelf_to_waist:
    description: "Hand moves from shelf/above-chest level to waist/pocket area"
    enabled: true

    # Pose-based detection parameters
    pose:
      min_hand_raised_frames: 2      # Frames with hand above waist level in early window
      min_hand_at_waist_frames: 2    # Frames with hand near waist in late window
      waist_proximity_ratio: 0.6     # Max wrist-waist dist as fraction of torso length

    # VLM confirmation (sent after pose match)
    vlm:
      enabled: true
      # Number of frames to send to VLM (evenly sampled from sequence)
      num_frames: 8
      prompt: |
        You are a retail-loss-prevention vision analyst. You will receive a short
        sequence of surveillance frames (chronological) of one person near a shelf.
        Decide whether the sequence shows likely product concealment.

        Clearly suspicious cues (raise confidence):
          - hand reaches a shelf, grasps an item, then moves it toward the waist,
            pocket, jacket, sleeve, bag, or under clothing
          - item visibly disappears against the body or into clothing
          - hand exits a pocket / bag / waistband holding a product
          - shielding the hand with the body or another hand while moving an item
            from shelf toward body

        Clearly NOT suspicious (lower confidence):
          - hand inspects an item and returns it to the shelf
          - person carries an item openly in hand at chest/waist level while walking
          - person places an item into an obvious shopping basket or trolley
          - person is only browsing / standing / looking, no product transfer

        Output strict JSON only, no prose:
        {
          "suspicious": true | false,
          "confidence": 0.0 to 1.0,
          "reasoning": "one short sentence describing what you actually see"
        }

        Confidence calibration -- pick the band that matches what is visible:
          0.80 - 1.00  clear product transfer toward body / pocket / under clothes
          0.50 - 0.79  strong indicators but one element is partially occluded
          0.30 - 0.49  ambiguous: hand near body but no clear product transfer
          0.00 - 0.29  confidently normal browsing / no concealment behaviour

        Do NOT default to ~0.10 when uncertain. If the frames are ambiguous,
        return a value in the 0.30-0.49 band. Only return < 0.30 when you are
        confident the behaviour is normal.
      # Expected fields in VLM JSON response
      response_fields:
        - suspicious    # bool
        - confidence    # float
        - reasoning     # str

  loitering:
    description: "Person remains stationary in a restricted area for too long"
    enabled: false

    pose:
      min_stationary_frames: 15
      movement_threshold: 0.05

    vlm:
      enabled: true
      num_frames: 3
      prompt: |
        Analyze these sequential frames of a person in a store.

        Determine if the person appears to be loitering:
        - Are they standing idle in one place for an extended period?
        - Do they appear to be waiting without a clear purpose?
        - Are they near high-value merchandise or restricted areas?

        Respond ONLY with valid JSON in this exact format:
        {
          "suspicious": true or false,
          "confidence": 0.0 to 1.0,
          "reasoning": "brief description of what you observe"
        }
      response_fields:
        - suspicious
        - confidence
        - reasoning
